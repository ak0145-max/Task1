<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Create your account</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #68738a;
			--line: #dce3ef;
			--primary: #4255d4;
			--primary-dark: #3043b7;
			--soft: #f5f7ff;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: var(--ink);
			background: linear-gradient(135deg, #eef2ff 0%, #f8fbff 52%, #edf9f7 100%);
			display: grid;
			place-items: center;
			padding: 32px 18px;
		}

		.card {
			width: min(100%, 1000px);
			min-height: 640px;
			display: grid;
			grid-template-columns: .9fr 1.1fr;
			background: #fff;
			border-radius: 24px;
			overflow: hidden;
			box-shadow: 0 24px 70px rgba(40, 57, 107, .16);
		}

		.intro {
			position: relative;
			padding: 58px 48px;
			color: #fff;
			background: linear-gradient(145deg, #3c4cc8, #6573e8);
			overflow: hidden;
		}
		.intro::after {
			content: "";
			position: absolute;
			width: 280px; height: 280px;
			right: -100px; bottom: -90px;
			border: 42px solid rgba(255,255,255,.1);
			border-radius: 50%;
		}
		.logo { font-size: 1.15rem; font-weight: 800; letter-spacing: .04em; }
		.intro h1 { max-width: 360px; margin: 92px 0 18px; font-size: clamp(2.2rem, 4vw, 3.25rem); line-height: 1.05; letter-spacing: -.05em; }
		.intro p { max-width: 330px; color: #e2e6ff; line-height: 1.7; }
		.benefits { position: absolute; left: 48px; bottom: 50px; display: grid; gap: 13px; color: #eef0ff; font-size: .92rem; }
		.benefits span::before { content: "✓"; display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 10px; border-radius: 50%; background: rgba(255,255,255,.2); font-weight: 700; }

		.form-area { padding: 54px clamp(28px, 6vw, 78px); display: flex; flex-direction: column; justify-content: center; }
		.form-area h2 { margin: 0 0 8px; font-size: 1.85rem; letter-spacing: -.03em; }
		.subtitle { margin: 0 0 28px; color: var(--muted); font-size: .94rem; }
		form { display: grid; gap: 17px; }
		.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
		label { display: grid; gap: 8px; color: #303b52; font-size: .82rem; font-weight: 700; }
		input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 13px 14px; color: var(--ink); background: #fff; font: inherit; outline: none; transition: .2s ease; }
		input::placeholder { color: #a1aabd; }
		input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(66,85,212,.1); }
		.password { position: relative; }
		.password input { padding-right: 62px; }
		.toggle { position: absolute; right: 12px; bottom: 12px; border: 0; padding: 0; color: var(--primary); background: transparent; cursor: pointer; font-size: .75rem; font-weight: 700; }
		.terms { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: .78rem; line-height: 1.45; }
		.terms input { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--primary); }
		a { color: var(--primary); text-decoration: none; font-weight: 700; }
		button[type="submit"] { border: 0; border-radius: 9px; padding: 14px; color: #fff; background: var(--primary); cursor: pointer; font: inherit; font-weight: 700; box-shadow: 0 8px 18px rgba(66,85,212,.22); transition: background .2s, transform .2s; }
		button[type="submit"]:hover { background: var(--primary-dark); transform: translateY(-1px); }
		.signin { margin: 24px 0 0; text-align: center; color: var(--muted); font-size: .86rem; }

		@media (max-width: 700px) {
			body { padding: 0; }
			.card { min-height: 100vh; border-radius: 0; grid-template-columns: 1fr; }
			.intro { padding: 32px 28px; min-height: 260px; }
			.intro h1 { margin: 48px 0 10px; font-size: 2.2rem; }
			.intro p { margin-bottom: 0; }
			.benefits { display: none; }
			.form-area { padding: 38px 28px; }
		}
		@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<main class="card">
		<section class="intro" aria-label="Welcome">
			<div class="logo">NOVA</div>
			<h1>Build something remarkable.</h1>
			<p>Join a focused community of creators and turn your best ideas into reality.</p>
			<div class="benefits"><span>Free forever for personal use</span><span>Secure and private by design</span></div>
		</section>
		<section class="form-area">
			<h2>Create your account</h2>
			<p class="subtitle">Start your journey today. It only takes a minute.</p>
			<form onsubmit="event.preventDefault(); alert('Welcome to NOVA!');">
				<div class="row">
					<label>First name<input type="text" placeholder="Olivia" autocomplete="given-name" required /></label>
					<label>Last name<input type="text" placeholder="Mason" autocomplete="family-name" required /></label>
				</div>
				<label>Email address<input type="email" placeholder="you@example.com" autocomplete="email" required /></label>
				<label class="password">Password<input id="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required /><button class="toggle" type="button" onclick="togglePassword()">Show</button></label>
				<label class="terms"><input type="checkbox" required /> <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span></label>
				<button type="submit">Create account</button>
			</form>
			<p class="signin">Already have an account? <a href="#">Sign in</a></p>
		</section>
	</main>
	<script>
		function togglePassword() {
			const password = document.getElementById('password');
			const button = document.querySelector('.toggle');
			password.type = password.type === 'password' ? 'text' : 'password';
			button.textContent = password.type === 'password' ? 'Show' : 'Hide';
		}
	</script>
</body>
</html>
