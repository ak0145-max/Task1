<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Project</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7ff, #dfe9ff);
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 2rem 3rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin-bottom: 1rem;
      }

      button {
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        cursor: pointer;
      }

      #message {
        margin-top: 1rem;
        font-size: 1rem;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello from Task 1</h1>
      <button id="clickBtn">Click Me</button>
      <p id="message">The page is ready.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
